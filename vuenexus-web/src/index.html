<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VueNexus UI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark">VN</div>
          <div>
            <h1>VueNexus</h1>
            <p>Frontend architecture graph</p>
          </div>
        </div>
        <form id="connect-form" class="connect-form">
          <input id="server-url" name="server" autocomplete="off" spellcheck="false" />
          <button type="submit">Connect</button>
        </form>
      </header>

      <section class="summary-strip">
        <div class="summary-card">
          <span>Nodes</span>
          <strong id="summary-nodes">0</strong>
        </div>
        <div class="summary-card">
          <span>Edges</span>
          <strong id="summary-edges">0</strong>
        </div>
        <div class="summary-card">
          <span>Files</span>
          <strong id="summary-files">0</strong>
        </div>
        <div class="summary-card">
          <span>Components</span>
          <strong id="summary-components">0</strong>
        </div>
        <div id="status" class="status">Not connected</div>
      </section>

      <section class="toolbar">
        <label>
          Repo
          <select id="repo-select"></select>
        </label>
        <label>
          Search
          <input id="search-input" placeholder="symbol, component, file..." autocomplete="off" />
        </label>
        <label>
          Edge
          <select id="edge-filter">
            <option value="">All</option>
            <option value="CALLS">CALLS</option>
            <option value="RENDERS">RENDERS</option>
            <option value="HANDLES">HANDLES</option>
            <option value="ROUTES_TO">ROUTES_TO</option>
            <option value="IMPORTS">IMPORTS</option>
            <option value="DEFINES">DEFINES</option>
          </select>
        </label>
        <button id="fit-button" type="button">Fit</button>
      </section>

      <section class="workspace">
        <aside class="left-panel">
          <section>
            <h2>Node Types</h2>
            <dl id="stats" class="stats"></dl>
          </section>
          <section>
            <h2>Legend</h2>
            <div id="legend" class="legend"></div>
          </section>
          <section>
            <h2>Matches</h2>
            <div id="matches" class="matches"></div>
          </section>
        </aside>

        <section class="canvas-wrap">
          <canvas id="graph-canvas"></canvas>
          <div class="canvas-help">Drag to pan · wheel to zoom · click a node</div>
        </section>

        <aside class="right-panel">
          <h2>Selection</h2>
          <div id="details" class="details empty">Select a node to inspect relationships.</div>
        </aside>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
